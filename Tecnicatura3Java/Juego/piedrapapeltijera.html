<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piedra Papel Tijera</title>

  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="contenedor">

    <h1>Piedra, Papel y Tijera</h1>

    <p class="subtitulo">
        Elige tu jugada
    </p>

    <div class="botones">

        <button id="btnPiedra" onclick="jugar(1)">
            🪨
        </button>

        <button id="btnPapel" onclick="jugar(2)">
            📄
        </button>

        <button id="btnTijera" onclick="jugar(3)">
            ✂️
        </button>

    </div>

    <div class="elecciones">

        <div class="mano" id="manoPc">
            ✋
        </div>

        <div class="mano" id="manoJugador">
            ✋
        </div>

    </div>

    <div id="mensaje">
        Empate
    </div>

    <div id="marcador">
        ✅ Victorias: 0 | ❌ Derrotas: 0
    </div>

    <button class="reiniciar" onclick="reiniciarJuego()">
        🔄 Reiniciar
    </button>

</div>

  <script src="codigo.js"></script>

</body>
</html>
